# 全域設定。每份報告可以在 projects/<名稱>/config.toml 寫同名欄位，覆寫這裡的值
# （只要寫想改的那幾項就好，其餘沿用這裡）。

[show]                          # 本次演出：通常寫在各報告自己的 config.toml
host = "C"                      # 主持人（角色代號，見下方 [characters]）
guests = []                     # 上鏡配角，順序 = 由左到右的站位；留空 = 依劇本有台詞的角色自動判斷
title = ""                      # 片頭大標；留空 = 用 story.py 的 TITLE，再沒有就用資料夾名稱
subtitle = ""                   # 片頭副標
topbar = ""                     # 畫面右上角小字；留空 = 同片頭大標

[timing]                        # 單位：秒
fps = 24
title_card = 3.2                # 片頭長度
scene_intro = 1.3               # 每段開頭頻道橫幅
line_gap = 0.22                 # 台詞之間的停頓
scene_gap = 0.5                 # 每段結尾多停的時間
end_card = 3.5                  # 片尾謝幕長度

[audio]
voice_volume = 0.95
bgm_volume = 1.0                # BGM 音量倍率（1 = 預設）
sfx_volume = 1.0                # 換頻道雜訊、蓋章音效的音量倍率

[layout]
# 配角站位（左上角 x 座標），依上鏡人數取用：1 人、2 人、3 人……；超過就平均分布在第一個到最後一個位置之間
guest_x = [[1500], [1150, 1500], [1020, 1290, 1540]]

# ---------------------------------------------------------------- 角色名冊
# 代號 = 劇本台詞的第一個欄位。name 顯示在對話框名牌，color 是名牌底色。
# voice / rate / pitch 是 edge-tts 聲線；改了要刪掉該報告的 audio/ 重新產生語音。
# sprite：characters/spr_<sprite>.png（Claude、GPT、DeepSeek 的嘴巴動畫寫在 sprites.py）
# hires = true：不是格狀像素圖的高解析度圖，會縮放到和其他角色一樣高，沒有嘴巴動畫
# card：片頭角色卡 characters/card_<card>.png（新角色可以用 make_card.py 產生）

[characters.C]
name = "Claude"
color = [232, 102, 28]
voice = "zh-TW-HsiaoChenNeural"
rate = "+16%"
pitch = "-4Hz"
sprite = "claude"
card = "claude"

[characters.G]
name = "GPT"
color = [138, 106, 208]
voice = "zh-TW-HsiaoYuNeural"
rate = "+18%"
pitch = "+8Hz"
sprite = "gpt"
card = "gpt"

[characters.D]
name = "DeepSeek"
color = [52, 104, 206]
voice = "zh-CN-XiaoyiNeural"
rate = "+18%"
pitch = "+0Hz"
sprite = "deepseek_open"
card = "deepseek"

[characters.M]
name = "Gemini"
color = [196, 92, 200]
voice = "zh-CN-XiaoxiaoNeural"
rate = "+14%"
pitch = "+6Hz"
sprite = "gemini"
hires = true
card = "gemini"
