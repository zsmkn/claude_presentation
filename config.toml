# 全域設定。每份報告可以在 projects/<名稱>/config.toml 寫同名欄位，覆寫這裡的值
# （只要寫想改的那幾項就好，其餘沿用這裡）。這個檔案也可以用 studio.py 的「設定」「角色」分頁編輯。

[show]                          # 本次演出：通常寫在各報告自己的 config.toml
host = "C"                      # 主持人（角色代號，見下方 [characters]）
guests = []                     # 上鏡配角，順序 = 由左到右的站位；留空 = 依劇本有台詞的角色自動判斷
title = ""                      # 片頭大標；留空 = 用資料夾名稱
subtitle = ""                   # 片頭副標
topbar = ""                     # 畫面右上角小字；留空 = 同片頭大標

[timing]                        # 單位：秒
fps = 24
title_card = 3.2                # 片頭長度
scene_intro = 1.3               # 每段開頭頻道橫幅
line_gap = 0.22                 # 台詞之間的停頓
scene_gap = 0.5                 # 每段結尾多停的時間
end_card = 3.5                  # 片尾謝幕長度

[audio]
voice_volume = 0.95
bgm_volume = 1.0                # BGM 音量倍率（1 = 預設）
sfx_volume = 1.0                # 換頻道雜訊、蓋章音效的音量倍率
bgm_bpm = 84                    # BGM 速度
tts_concurrency = 6             # 產生語音時同時連線數

[video]                         # ffmpeg 編碼品質
crf = 20                        # 越小畫質越好、檔案越大（18–28）
preset = "medium"               # ultrafast … medium … veryslow

[layout]
guest_x = [[1500], [1150, 1500], [1020, 1290, 1540]]  # 配角站位（左上角 x），依上鏡人數取用：1 人、2 人、3 人……；超過就平均分布在第一個到最後一個位置之間

[style]                         # 字型路徑與畫面配色（RGB）
font_cjk = "C:/Windows/Fonts/msjhbd.ttc"
font_latin = "C:/Windows/Fonts/seguibl.ttf"
font_mono = "C:/Windows/Fonts/consolab.ttf"
font_symbol = "C:/Windows/Fonts/seguisym.ttf"
accent = [232, 102, 28]                        # 頻道標籤、片頭標題、對話框箭頭
ink = [59, 31, 20]                             # 文字與外框
paper = [253, 247, 238]                        # 對話框、標題框底色
cream = [247, 240, 230]                        # 背景底色
dot = [228, 214, 196]                          # 背景點陣
muted = [150, 110, 90]                         # 右上角小字、NOTE 小字
lime = [212, 245, 60]                          # 蓋章標籤、時間碼

[text]                          # 畫面上固定出現的文字
end_card = "THANK YOU"                                                            # 片尾大字
host_label = "主持"                                                                 # 片頭主持人標籤：<host_label>  <名字>
rec = "REC"
hazard_tape = "CAUTION  //  HOLLOW ZONE  //  PROXY ONLY  //  SIGNAL LOST  //  "   # 換頻道時飛過的警示膠帶文字
symbols = ["∑", "π", "∫", "√", "Δ", "∞", "≈", "λ", "θ", "∂", "H₂O", "∝", "e^iπ"]  # 背景漂浮的符號

# ---------------------------------------------------------------- 角色名冊
# 代號 = 劇本台詞的講者欄位。name 顯示在對話框名牌，color 是名牌底色。
# voice / rate / pitch 是 edge-tts 聲線；語音檔以內容命名，改了聲線會自動重新產生。
# sprite：characters/spr_<sprite>.png（claude、gpt、deepseek_open 有嘴巴動畫，寫在 sprites.py）
# hires = true：不是格狀像素圖的高解析度圖，會縮放到和其他角色一樣高，沒有嘴巴動畫
# card：片頭角色卡 characters/card_<card>.png（可以用下方 [cards] 設定 + make_card.py 產生）

[characters.C]
name = "Claude"
color = [232, 102, 28]
voice = "zh-TW-HsiaoChenNeural"
rate = "+16%"
pitch = "-4Hz"
sprite = "claude"
card = "claude"

[characters.G]
name = "GPT"
color = [138, 106, 208]
voice = "zh-TW-HsiaoYuNeural"
rate = "+18%"
pitch = "+8Hz"
sprite = "gpt"
card = "gpt"

[characters.D]
name = "DeepSeek"
color = [52, 104, 206]
voice = "zh-CN-XiaoyiNeural"
rate = "+18%"
pitch = "+0Hz"
sprite = "deepseek_open"
card = "deepseek"

[characters.M]
name = "Gemini"
color = [196, 92, 200]
voice = "zh-CN-XiaoxiaoNeural"
rate = "+14%"
pitch = "+6Hz"
sprite = "gemini"
hires = true
card = "gemini"

# ---------------------------------------------------------------- 角色卡產生器（make_card.py）
# 用立繪產生 characters/card_<名稱>.png。scale 立繪縮放、top 立繪頂端落在卡片的 y、
# fade = [開始, 結束]：立繪在這兩個 y 之間淡出。

[cards.gemini]
src = "references/gemini_illust_ref.png"
name = "Gemini"
subtitle = "Gemini CLI"
name_color = [104, 54, 164]
tint = [240, 234, 252]
border = [230, 226, 234]
scale = 0.44
top = -6
fade = [400, 505]
